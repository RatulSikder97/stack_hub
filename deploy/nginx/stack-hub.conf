# Stack Hub Studio — nginx reverse proxy.
#
# Drop into /etc/nginx/sites-available/stack-hub.conf, then:
#   sudo ln -s /etc/nginx/sites-available/stack-hub.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with the actual hostname before enabling. After install,
# run `sudo certbot --nginx -d YOUR_DOMAIN` to add HTTPS — certbot rewrites
# this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Increase max body for transcript uploads.
    client_max_body_size 8m;

    # Gzip text responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ----- React SPA (built into webapp/dist) -----
    location / {
        root /opt/stack-hub/webapp/dist;
        try_files $uri $uri/ /index.html;

        # Don't cache index.html (so updates roll out instantly).
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }

    # Long-term cache for hashed Vite assets.
    location ^~ /assets/ {
        root /opt/stack-hub/webapp/dist;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ----- FastAPI backend on 127.0.0.1:8765 -----
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM calls can take 30-60s; raise the read timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Don't buffer streamed responses.
        proxy_buffering off;
    }

    # ----- Lightweight health probe for monitoring -----
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8765/api/auth/me;
    }
}
