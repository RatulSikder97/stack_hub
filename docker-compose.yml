# =============================================================================
# Stack Hub Studio — production compose for self-hosted deploy.
#
# Two services:
#   * stackhub  — FastAPI + React SPA, pulled from GHCR (built by CI on main)
#   * caddy     — reverse proxy, auto-HTTPS via Let's Encrypt
#
# Required env vars (in .env next to this file):
#   IMAGE                       e.g. ghcr.io/yourname/stack-hub:latest
#   DOMAIN                      public hostname pointing to this server
#   ACME_EMAIL                  email for Let's Encrypt cert notifications
#   ADMIN_PASSWORD              initial admin password
#   AUTH_SECRET                 32+ random chars (signs session cookies)
#   GEMINI_API_KEY              (or OPENAI / ANTHROPIC / NOVITA)
#
# Server bring-up (no source on disk, just compose + Caddyfile + .env):
#   docker compose pull
#   docker compose up -d
#
# Roll out a new image (CI pushed a new :latest):
#   docker compose pull stackhub && docker compose up -d stackhub
#
# Tear down (data volumes persist):
#   docker compose down
# =============================================================================

services:
  stackhub:
    image: ${IMAGE:?Set IMAGE=ghcr.io/<your-org>/<your-repo>:latest in .env}
    container_name: stackhub
    restart: unless-stopped
    env_file: .env
    expose:
      - "8765"
    volumes:
      - stackhub-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8765/api/auth/me').status in (200,401) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stackhub-net

  caddy:
    image: caddy:2-alpine
    container_name: stackhub-caddy
    restart: unless-stopped
    depends_on:
      - stackhub
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - stackhub-net

volumes:
  stackhub-data:
  caddy-data:
  caddy-config:

networks:
  stackhub-net:
